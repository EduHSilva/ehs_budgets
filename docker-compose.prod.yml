# Produção: usa a imagem publicada no GitHub Container Registry.
# A stack dos microservices deve estar ativa e sua rede externa deve existir.

services:
  budgets-ui:
    image: ${BUDGETS_UI_IMAGE:-ghcr.io/eduhsilva/budgets-ui:${IMAGE_TAG:-latest}}
    container_name: budgets-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default: {}
      ehs_microservices:
        aliases:
          - budgets-ui

networks:
  ehs_microservices:
    external: true
    name: ${EHS_MICROSERVICES_NETWORK:-microservices_backend}
